<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strata · The Solana blockchain, alive</title>
  <meta name="description" content="Watch the network grow in real time." />

  <!-- Social preview (canonical copy: COPY.md) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Strata" />
  <meta property="og:title" content="Strata · The Solana blockchain, alive" />
  <meta property="og:description" content="Watch the network grow in real time." />
  <meta property="og:image" content="https://exploresolana.art/og-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Strata: a glowing crystal rising from Solana's validator field." />
  <meta property="og:url" content="https://exploresolana.art/" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Strata · The Solana blockchain, alive" />
  <meta name="twitter:description" content="Watch the network grow in real time." />
  <meta name="twitter:image" content="https://exploresolana.art/og-preview.png" />

  <link rel="canonical" href="https://exploresolana.art/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#050510" />

  <!-- Brand faces (ABC Diatype): preload the two Regular weights the UI paints first -->
  <link rel="preload" href="/fonts/ABCDiatype-Regular.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="/fonts/ABCDiatypeSemi-Mono-Regular.otf" as="font" type="font/otf" crossorigin />

  <style>
    @font-face {
      font-family: 'ABC Diatype';
      src: url('/fonts/ABCDiatype-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'ABC Diatype';
      src: url('/fonts/ABCDiatype-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'ABC Diatype Semi-Mono';
      src: url('/fonts/ABCDiatypeSemi-Mono-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'ABC Diatype Semi-Mono';
      src: url('/fonts/ABCDiatypeSemi-Mono-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
    #app { width: 100vw; height: 100vh; }
    #app canvas { display: block; }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-family: 'ABC Diatype Semi-Mono', 'SF Mono', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      z-index: 100;
    }
    #webgl-error {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'ABC Diatype Semi-Mono', 'SF Mono', monospace;
      font-size: 14px;
      line-height: 1.8;
      z-index: 100;
    }
    #webgl-error h2 {
      color: rgba(255, 255, 255, 0.8);
      font-size: 18px;
      margin-bottom: 12px;
      font-weight: 400;
    }
    @keyframes txFadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    /* Mobile adjustments */
    @media (max-width: 768px) {
      .hud-text { font-size: 10px !important; }
      .hud-value { font-size: 12px !important; }
      .hud-top-left { top: 16px !important; left: 16px !important; }
      .hud-top-right { top: 16px !important; right: 16px !important; }
      .hud-bottom-center { bottom: 16px !important; }
      .tps-bar-container { width: 140px !important; }
    }
    @media (max-width: 480px) {
      .hud-top-left, .hud-top-right { font-size: 9px !important; }
      .hud-value { font-size: 11px !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <div id="loading"></div>
  <div id="webgl-error">
    <h2>WebGL Required</h2>
    <p>This visualization requires WebGL to render.<br/>
    Please use a modern browser with hardware acceleration enabled.</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
